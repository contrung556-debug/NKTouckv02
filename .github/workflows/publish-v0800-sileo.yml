name: Publish NKTouch v0.8.0 Integrated Lua SDK beta to Sileo (one-shot)

on:
  push:
    branches: [ v0.8.0-integrated-beta-dev ]
    paths:
      - .github/workflows/publish-v0800-sileo.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: nktouch-sileo-v0800-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NKTouch publisher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify successful pinned v0.8.0 rootless build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/contrung556-debug/NKTouckv02/actions/runs/42017314957 \
            -o /tmp/nk-v0800-green-run.json
          python3 - <<'PY'
          import json
          run=json.load(open('/tmp/nk-v0800-green-run.json'))
          assert run['status']=='completed'
          assert run['conclusion']=='success'
          assert run['head_branch']=='v0.8.0-integrated-beta-dev'
          assert run['head_sha']=='367d1e5bc896db6d37de05918116ec1164650407'
          assert run['id']==42017314957
          print('Verified immutable successful v0.8.0 beta build', run['id'])
          PY

      - name: Download exact tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: NKTouch-v0.8.0-integrated-rootless
          run-id: 42017314957
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sileo-artifact

      - name: Validate package and publish existing Sileo source as experimental beta
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev
          bash -n scripts/publish-v0800-sileo.sh
          bash scripts/publish-v0800-sileo.sh

      - name: Confirm published Sileo branch contents
        run: |
          set -euo pipefail
          git fetch origin sileo-repo
          git show FETCH_HEAD:Packages | grep -Fxq 'Version: 0.8.0'
          git show FETCH_HEAD:Packages | grep -Fxq 'Filename: debs/com.nk.nktouch_0.8.0_iphoneos-arm64.deb'
          git show FETCH_HEAD:README.md | grep -Fq 'Current package: com.nk.nktouch 0.8.0'
          git show FETCH_HEAD:README.md | grep -Fq 'device OCR, Touch and Memory verification pending'
          git ls-tree -r --name-only FETCH_HEAD | grep -Fxq 'debs/com.nk.nktouch_0.8.0_iphoneos-arm64.deb'
          echo 'PUBLISHED NKTouch 0.8.0 experimental beta to Sileo; iPhone validation pending'
