name: Validate NKTouch v0.8.0 Integrated SDK (no build)
on:
  push:
    branches: [v0.8.0-integrated-beta-dev]
    paths:
      - lua/nkdiagnostics.lua
      - lua/nksnapshot.lua
      - lua/nkactions.lua
      - lua/nksdk.lua
      - lua/nktestlab.lua
      - patches/NKTestLabUIViewController.m.inc
      - scripts/prepare-v0800-release.sh
      - examples/nk_v0800_readonly_demo.lua
      - tests/test_v0800_integrated.py
      - tests/test_v0800_release.py
      - .github/workflows/validate-v0800-integrated.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Validate all integrated modules and retained gates
        run: |
          set -euo pipefail
          bash -n scripts/prepare-v0800-release.sh
          for f in lua/nkdiagnostics.lua lua/nksnapshot.lua lua/nkactions.lua lua/nksdk.lua lua/nktestlab.lua examples/nk_v0800_readonly_demo.lua; do
            luac5.4 -p "$f"
          done
          python3 -m unittest \
            tests/test_v0800_integrated.py \
            tests/test_v0800_release.py \
            tests/test_v0719_testlab_5core.py \
            tests/test_v0716_testlab_ui.py \
            tests/test_v0716_testlab_runner.py \
            tests/test_v0716_reliability_report.py \
            tests/test_v0716_color_accuracy.py \
            tests/test_v0717_stability_memory.py \
            tests/test_v0718_ocr_ciimage.py -v
