name: Publish NKTouch 0.7.5.3.3 Recorder Status Hotfix to Sileo

on:
  workflow_dispatch:
  push:
    branches: [ v0.7.5.3.2-recorder-spawn-fix ]
    paths:
      - .github/workflows/publish-sileo-07533-repack.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: 13148451932
      PACKAGE_VERSION: 0.7.5.3.3
      DEB_NAME: com.nk.nktouch_0.7.5.3.3_iphoneos-arm64.deb
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Debian tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Download green 0.7.5.3.2 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/nktouch7532.zip
          rm -rf /tmp/nktouch7532-artifact
          mkdir -p /tmp/nktouch7532-artifact
          unzip -q /tmp/nktouch7532.zip -d /tmp/nktouch7532-artifact
          SRC_DEB="$(find /tmp/nktouch7532-artifact -type f -name '*.deb' | head -1)"
          test -n "$SRC_DEB"
          test "$(dpkg-deb -f "$SRC_DEB" Version)" = "0.7.5.3.2"
          echo "$SRC_DEB" > /tmp/source_deb

      - name: Repack Recorder status fix
        run: |
          set -euxo pipefail
          SRC_DEB="$(cat /tmp/source_deb)"
          rm -rf /tmp/nktouch7533-pkg
          dpkg-deb -R "$SRC_DEB" /tmp/nktouch7533-pkg
          python3 - <<'PY'
          from pathlib import Path
          rec=Path('/tmp/nktouch7533-pkg/var/jb/usr/bin/nkrecorder')
          s=rec.read_text()
          old='''    last="$(latest_timeline 2>/dev/null || true)"\n    [ -n "$last" ] && echo "latest=$last"\n    ;;\n'''
          new='''    last="$(latest_timeline 2>/dev/null || true)"\n    if [ -n "$last" ]; then echo "latest=$last"; fi\n    exit 0\n    ;;\n'''
          if old not in s:
              raise SystemExit('Recorder status tail marker not found')
          rec.write_text(s.replace(old,new,1))
          rec.chmod(0o755)
          ctl=Path('/tmp/nktouch7533-pkg/DEBIAN/control')
          c=ctl.read_text().replace('Version: 0.7.5.3.2','Version: 0.7.5.3.3',1)
          lines=[]
          for line in c.splitlines():
              if line.startswith('Description:'):
                  line='Description: NKTouch v0.7.5.3.3 Recorder status hotfix; valid recording status exits 0, trusted shell spawn retained, Editor Pro and direct lua54 runtime retained'
              lines.append(line)
          ctl.write_text('\n'.join(lines).rstrip()+'\n')
          PY
          grep -A12 '^  status)' /tmp/nktouch7533-pkg/var/jb/usr/bin/nkrecorder | grep -q 'exit 0'
          dpkg-deb -b -Zxz --root-owner-group /tmp/nktouch7533-pkg "/tmp/${DEB_NAME}"
          test "$(dpkg-deb -f /tmp/${DEB_NAME} Package)" = "com.nk.nktouch"
          test "$(dpkg-deb -f /tmp/${DEB_NAME} Version)" = "${PACKAGE_VERSION}"
          test "$(dpkg-deb -f /tmp/${DEB_NAME} Architecture)" = "iphoneos-arm64"

      - name: Update Sileo repository metadata
        run: |
          set -euxo pipefail
          git fetch origin sileo-repo:sileo-repo
          rm -rf /tmp/nktouch-sileo
          git worktree add /tmp/nktouch-sileo sileo-repo
          cd /tmp/nktouch-sileo
          mkdir -p debs
          cp "/tmp/${DEB_NAME}" "debs/${DEB_NAME}"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, re
          root=Path('/tmp/nktouch-sileo')
          deb_name='com.nk.nktouch_0.7.5.3.3_iphoneos-arm64.deb'
          deb=root/'debs'/deb_name
          old=(root/'Packages').read_text() if (root/'Packages').exists() else ''
          kept=[]
          for stanza in old.strip().split('\n\n') if old.strip() else []:
              if '\nVersion: 0.7.5.3.3\n' in '\n'+stanza+'\n':
                  continue
              kept.append(stanza.strip())
          control=subprocess.check_output(['dpkg-deb','-f',str(deb)], text=True).rstrip()
          data=deb.read_bytes()
          new='\n'.join([control,f'Filename: debs/{deb_name}',f'Size: {len(data)}',f'MD5sum: {hashlib.md5(data).hexdigest()}',f'SHA1: {hashlib.sha1(data).hexdigest()}',f'SHA256: {hashlib.sha256(data).hexdigest()}','Homepage: https://github.com/contrung556-debug/NKTouckv02'])
          (root/'Packages').write_text(new+'\n\n'+('\n\n'.join(kept)+'\n' if kept else ''))
          readme=root/'README.md'; rs=readme.read_text(); rs=re.sub(r'Current package: com\.nk\.nktouch [^ ]+ \(iphoneos-arm64\).*','Current package: com.nk.nktouch 0.7.5.3.3 (iphoneos-arm64) — Recorder Status Hotfix',rs); readme.write_text(rs)
          index=root/'index.html'; ix=index.read_text(); ix=re.sub(r'NKTouch 0\.7\.5\.3(?:\.1|\.2|\.3)?','NKTouch 0.7.5.3.3',ix); index.write_text(ix)
          PY
          gzip -9c Packages > Packages.gz
          P_SIZE=$(wc -c < Packages | tr -d ' ')
          G_SIZE=$(wc -c < Packages.gz | tr -d ' ')
          P_MD5=$(md5sum Packages | awk '{print $1}')
          G_MD5=$(md5sum Packages.gz | awk '{print $1}')
          P_SHA=$(sha256sum Packages | awk '{print $1}')
          G_SHA=$(sha256sum Packages.gz | awk '{print $1}')
          cat > Release <<EOF
          Origin: NKTouch
          Label: NKTouch Repository
          Suite: stable
          Version: 1.0
          Codename: nktouch
          Architectures: iphoneos-arm64
          Components: main
          Description: NKTouch rootless automation packages for Sileo
          MD5Sum:
           ${P_MD5} ${P_SIZE} Packages
           ${G_MD5} ${G_SIZE} Packages.gz
          SHA256:
           ${P_SHA} ${P_SIZE} Packages
           ${G_SHA} ${G_SIZE} Packages.gz
          EOF
          grep -q '^Version: 0.7.5.3.3$' Packages
          grep -q '^Filename: debs/com.nk.nktouch_0.7.5.3.3_iphoneos-arm64.deb$' Packages
          gzip -dc Packages.gz | cmp -s - Packages

      - name: Commit and publish sileo-repo branch
        run: |
          set -euxo pipefail
          cd /tmp/nktouch-sileo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Packages Packages.gz Release README.md index.html "debs/${DEB_NAME}"
          git commit -m 'Publish NKTouch 0.7.5.3.3 Recorder status hotfix'
          git push origin sileo-repo

      - name: Verify published branch locally
        run: |
          set -euxo pipefail
          cd /tmp/nktouch-sileo
          grep -A20 '^Package: com.nk.nktouch$' Packages | head -25
          sha256sum "debs/${DEB_NAME}"
