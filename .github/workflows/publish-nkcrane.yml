name: Publish NKCrane to existing Sileo repo

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-nkcrane.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Download verified NKCrane 1.4.0
        run: |
          set -euo pipefail
          # The NKCrane source repo builds gh-pages independently.
          # Poll for the exact verified version rather than downloading stale 1.3.2.
          DEB="/tmp/com.nktouch.nkcrane_1.4.0_iphoneos-arm64.deb"
          URL="https://raw.githubusercontent.com/contrung556-debug/Nkcrane/gh-pages/debs/com.nktouch.nkcrane_1.4.0_iphoneos-arm64.deb"
          for attempt in $(seq 1 30); do
            if curl -fLsS --retry 2 -H 'Cache-Control: no-cache' -o "$DEB" "$URL" &&
               dpkg-deb -f "$DEB" Version 2>/dev/null | grep -qx '1.4.0'; then
              echo "Verified upstream NKCrane v1.4.0 available on attempt $attempt"
              break
            fi
            echo "Waiting for upstream signed rootless build ($attempt/30)"
            rm -f "$DEB"
            sleep 10
          done
          test -s "$DEB"

          test "$(dpkg-deb -f /tmp/com.nktouch.nkcrane_1.4.0_iphoneos-arm64.deb Package)" = "com.nktouch.nkcrane"
          test "$(dpkg-deb -f /tmp/com.nktouch.nkcrane_1.4.0_iphoneos-arm64.deb Version)" = "1.4.0"
          test "$(dpkg-deb -f /tmp/com.nktouch.nkcrane_1.4.0_iphoneos-arm64.deb Architecture)" = "iphoneos-arm64"
          # This Sileo source ships only the safe default v1.4 build.
          VERIFY_ROOT="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$VERIFY_ROOT"
          test -n "$(find "$VERIFY_ROOT" -type f -name 'NKCrane.dylib' | head -n1)"
          ! find "$VERIFY_ROOT" -type f \( -name 'NKCraneRB.dylib' -o -name 'NKCraneRB.plist' \) | grep -q .


      - name: Checkout existing Sileo branch
        uses: actions/checkout@v4
        with:
          ref: sileo-repo
          path: repo
          fetch-depth: 0

      - name: Add package and rebuild flat APT metadata
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p debs
          cp /tmp/com.nktouch.nkcrane_1.4.0_iphoneos-arm64.deb debs/

          dpkg-scanpackages --multiversion debs /dev/null > Packages
          rm -f Packages.gz Packages.bz2 Packages.xz Packages.zst

          PKG_MD5=$(md5sum Packages | awk '{print $1}')
          PKG_SHA=$(sha256sum Packages | awk '{print $1}')
          PKG_SIZE=$(stat -c%s Packages)

          cat > Release <<EOF
          Origin: NKTouch Repository
          Label: NKTouch Repository
          Suite: stable
          Version: 1.4.0
          Codename: nktouch
          Architectures: iphoneos-arm64
          Components: main
          Description: NKTouch and NKCrane rootless repository for Sileo/Zebra
          Date: $(date -Ru)
          MD5Sum:
           $PKG_MD5 $PKG_SIZE Packages
          SHA256:
           $PKG_SHA $PKG_SIZE Packages
          EOF

          grep -A18 -B2 '^Version: 1.4.0$' Packages

      - name: Commit to existing Sileo source
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sileo repository already up to date"
            exit 0
          fi
          git commit -m "Publish NKCrane 1.4.0 flat index"
          git push origin HEAD:sileo-repo
