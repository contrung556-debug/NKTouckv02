name: Publish NKTouch v0.8.8 Vision Speed & Screen Stability Beta to existing Sileo

# Publisher pinned to build 42150451051; retain OCR v083, Input v085 and Precision v086 samples; preserve all prior packages.
on:
  push:
    branches: [v0.8.8-vision-speed-stability-dev]
    paths:
      - .github/workflows/publish-v088-sileo.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nktouch-sileo-v088-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v0.8.8 pinned artifact publisher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify successful exact v0.8.8 build (fail closed)
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/contrung556-debug/NKTouckv02/actions/workflows/build-v088-vision-speed.yml/runs?branch=v0.8.8-vision-speed-stability-dev&per_page=100" \
            -o /tmp/nktouch-v088-runs.json
          python3 - <<'PY'
          import json,os
          obj=json.load(open("/tmp/nktouch-v088-runs.json"))
          pinned_sha="a3610c1a65df0fce3d3a4ecd548fcd6cdb04d591"
          candidates=[
              run for run in obj.get("workflow_runs",[])
              if run.get("head_branch")=="v0.8.8-vision-speed-stability-dev"
              and run.get("head_sha")==pinned_sha
              and run.get("status")=="completed"
              and run.get("conclusion")=="success"
              and run.get("event")=="push"
          ]
          if not candidates:
              raise SystemExit("No successful artifact for pinned v0.8.8 build; refuse Sileo publication")
          run=max(candidates,key=lambda r:r["id"])
          if run["id"]!=42150451051:
              raise SystemExit("Expected exact artifact-producing run 42150451051; abort publication")
          with open(os.environ["GITHUB_OUTPUT"],"a") as fp:
              fp.write(f"run_id={run['id']}\n")
          print(f"Verified successful and exact v0.8.8 iOS build {run['id']} at {pinned_sha}")
          PY

      - name: Download the exact verified iOS .deb
        uses: actions/download-artifact@v4
        with:
          name: NKTouch-v0.8.8-vision-speed-rootless
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sileo-artifact

      - name: Inspect binary and publish beta while retaining rollback packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev
          bash -n scripts/publish-v088-sileo.sh
          bash scripts/publish-v088-sileo.sh

      - name: Verify Sileo branch publication and retained prior versions
        run: |
          set -euo pipefail
          git fetch origin sileo-repo
          # Avoid SIGPIPE (exit 141) when grep -q closes a Git output pipe.
          git show FETCH_HEAD:Packages > /tmp/nktouch-v088-published-packages
          git show FETCH_HEAD:README.md > /tmp/nktouch-v088-published-readme
          git ls-tree -r --name-only FETCH_HEAD > /tmp/nktouch-v088-published-files
          grep -Fxq 'Version: 0.8.8' /tmp/nktouch-v088-published-packages
          grep -Fxq 'Filename: debs/com.nk.nktouch_0.8.8_iphoneos-arm64.deb' /tmp/nktouch-v088-published-packages
          grep -Fxq 'Version: 0.8.2' /tmp/nktouch-v088-published-packages
          grep -Fxq 'Version: 0.8.1' /tmp/nktouch-v088-published-packages
          grep -Fxq 'Version: 0.8.3' /tmp/nktouch-v088-published-packages
          grep -Fxq 'Version: 0.8.5' /tmp/nktouch-v088-published-packages
          grep -Fxq 'Version: 0.8.6' /tmp/nktouch-v088-published-packages
          grep -Fxq 'Version: 0.8.7' /tmp/nktouch-v088-published-packages
          grep -Fq 'Current package: com.nk.nktouch 0.8.8' /tmp/nktouch-v088-published-readme
          grep -Fxq 'debs/com.nk.nktouch_0.8.8_iphoneos-arm64.deb' /tmp/nktouch-v088-published-files
          grep -Fxq 'debs/com.nk.nktouch_0.8.2_iphoneos-arm64.deb' /tmp/nktouch-v088-published-files
          grep -Fxq 'debs/com.nk.nktouch_0.8.3_iphoneos-arm64.deb' /tmp/nktouch-v088-published-files
          grep -Fxq 'debs/com.nk.nktouch_0.8.5_iphoneos-arm64.deb' /tmp/nktouch-v088-published-files
          grep -Fxq 'debs/com.nk.nktouch_0.8.6_iphoneos-arm64.deb' /tmp/nktouch-v088-published-files
          grep -Fxq 'debs/com.nk.nktouch_0.8.7_iphoneos-arm64.deb' /tmp/nktouch-v088-published-files
          grep -Fxq 'Package: com.nktouch.nkcrane' /tmp/nktouch-v088-published-packages || echo 'NKCrane package spelling differs; publisher preserved existing stanzas'
          echo 'PUBLISHED NKTouch v0.8.8 Vision Speed & Screen Stability to existing Sileo source; Vision speed and screen stability still require device profiling.'
