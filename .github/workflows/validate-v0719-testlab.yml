name: Validate NKTouch v0.7.19 Five-Core Test Lab
on:
  push:
    branches: [v0.7.19-testlab-5core-dev]
    paths:
      - lua/nktestlab.lua
      - patches/NKTestLabUIViewController.m.inc
      - scripts/prepare-v0719-release.sh
      - tests/test_v0716_testlab_ui.py
      - tests/test_v0719_testlab_5core.py
      - .github/workflows/validate-v0719-testlab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Validate staging and compile Lua
        run: |
          set -euo pipefail
          bash -n scripts/prepare-v0719-release.sh
          luac5.4 -p lua/nktestlab.lua
          python3 -m unittest \
             tests/test_v0719_testlab_5core.py \
             tests/test_v0716_testlab_ui.py \
             tests/test_v0716_testlab_runner.py \
             tests/test_v0716_reliability_report.py \
             tests/test_v0716_color_accuracy.py \
             tests/test_v0717_stability_memory.py \
             tests/test_v0718_ocr_ciimage.py -v
