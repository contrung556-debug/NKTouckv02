name: Publish NKTouch v0.7.17 Stability and Memory beta to Sileo (one-shot)

on:
  push:
    branches: [ v0.7.17-stability-memory-dev ]
    paths:
      - .github/workflows/publish-v0717-sileo.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: nktouch-sileo-v0717-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NKTouch publisher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify successful pinned v0.7.17 rootless build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/contrung556-debug/NKTouckv02/actions/runs/41996735853 \
            -o /tmp/nk-v0717-green-run.json
          python3 - <<'PY'
          import json
          run=json.load(open('/tmp/nk-v0717-green-run.json'))
          assert run['status']=='completed'
          assert run['conclusion']=='success'
          assert run['head_branch']=='v0.7.17-stability-memory-dev'
          assert run['head_sha']=='8dd038edb661c972ad1d655c77bfec2a00e8aa23'
          assert run['id']==41996735853
          print('Verified immutable successful v0.7.17 beta build', run['id'])
          PY

      - name: Download exact tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: NKTouch-v0.7.17-stability-memory-rootless
          run-id: 41996735853
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sileo-artifact

      - name: Validate package and publish existing Sileo source as experimental beta
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev
          bash -n scripts/publish-v0717-sileo.sh
          bash scripts/publish-v0717-sileo.sh

      - name: Confirm published Sileo branch contents
        run: |
          set -euo pipefail
          git fetch origin sileo-repo
          git show FETCH_HEAD:Packages | grep -Fxq 'Version: 0.7.17'
          git show FETCH_HEAD:Packages | grep -Fxq 'Filename: debs/com.nk.nktouch_0.7.17_iphoneos-arm64.deb'
          git show FETCH_HEAD:README.md | grep -Fq 'Current package: com.nk.nktouch 0.7.17'
          git show FETCH_HEAD:README.md | grep -Fq 'device crash/RSS not verified'
          git ls-tree -r --name-only FETCH_HEAD | grep -Fxq 'debs/com.nk.nktouch_0.7.17_iphoneos-arm64.deb'
          echo 'PUBLISHED NKTouch 0.7.17 experimental beta to Sileo; iPhone validation pending'
