name: Validate NKTouch v0.8.6 Touch Color Precision (host contracts)

on:
  push:
    branches: [v0.8.6-touch-color-precision-dev]
    paths:
      - lua/nkprecision.lua
      - examples/test_precision_colors_v086.lua
      - examples/test_precision_touch_v086.lua
      - scripts/stage-v086-precision.sh
      - tests/lua_v086_precision.lua
      - tests/test_v086_precision.py
      - .github/workflows/build-v086-precision.yml
      - .github/workflows/validate-v086-precision.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Parse Lua/shell and run deterministic no-device precision contracts
        run: |
          set -euo pipefail
          bash -n scripts/stage-v086-precision.sh
          luac5.4 -p lua/nkprecision.lua
          luac5.4 -p examples/test_precision_colors_v086.lua
          luac5.4 -p examples/test_precision_touch_v086.lua
          lua5.4 tests/lua_v086_precision.lua
      - name: Run cross-version regression suite
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_v086_precision.py             tests/test_v085_input_pro.py             tests/test_v083_perf.py             tests/test_v0716_color_accuracy.py             tests/test_v0712_inputtext_fix.py -v
