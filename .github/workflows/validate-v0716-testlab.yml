name: Validate NKTouch Test Lab (fast, no build)

# Development-only validation. No macOS, Theos, dpkg or Sileo publication.
on:
  workflow_dispatch:
  push:
    branches: [ v0.7.16-command-hardening-dev ]
    paths:
      - lua/nktestlab.lua
      - lua/nkinput_v2.lua
      - lua/nknet.lua
      - lua/nkjson.lua
      - lua/nkvision.lua
      - lua/nkmemory.lua
      - runtime/nkvision.m
      - scripts/stage-v0716-testlab-dev.sh
      - lua/nkcoords.lua
      - lua/nkstability.lua
      - lua/nkregression.lua
      - scripts/check-v0716-readiness.py
      - scripts/prepare-v0716-release.sh
      - scripts/publish-v0716-sileo.sh
      - tests/test_v0716_release_workflow_shell.py
      - .github/workflows/build-v0716-reliability-testlab.yml
      - runtime/nkcore.c
      - patches/NKTestLabUIViewController.m.inc
      - scripts/apply-v0716-testlab-ui.py
      - scripts/stage-v0716-testlab-dev.sh
      - tests/test_v0716_testlab_runner.py
      - tests/test_v0716_testlab_ui.py
      - tests/test_v0716_reliability_report.py
      - tests/test_v0716_color_accuracy.py
      - tests/lua_v0716_coords_stability.lua
      - tests/lua_v0716_regression.lua
      - tests/lua_v0716_input_json_hardening.lua
      - tests/lua_v0716_http_atomic.lua
      - tests/lua_v0716_vision_lifecycle.lua
      - tests/test_v0716_task_supervisor_host.py
      - tests/test_v0716_native_preflight.py
      - tests/test_v0716_memory_core.py
      - .github/workflows/validate-v0716-testlab.yml

permissions:
  contents: read

jobs:
  testlab-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install Lua 5.4 host runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 liblua5.4-dev pkg-config gcc
          lua -v
      - name: Preflight bash syntax for all release workflow run blocks
        run: |
          python3 -m unittest tests/test_v0716_release_workflow_shell.py -v
      - name: Validate Lua syntax and source patch
        run: |
          set -euxo pipefail
          luac -p lua/nktestlab.lua
          luac -p lua/nkcoords.lua
          luac -p lua/nkstability.lua
          luac -p lua/nkregression.lua
          luac -p lua/nkinput_v2.lua
          luac -p lua/nknet.lua
          luac -p lua/nkjson.lua
          luac -p lua/nkvision.lua
          luac -p lua/nkmemory.lua
          luac -p tests/lua_v0716_input_json_hardening.lua
          luac -p tests/lua_v0716_http_atomic.lua
          luac -p tests/lua_v0716_vision_lifecycle.lua
          luac -p tests/lua_v0716_regression.lua
          python3 -m py_compile scripts/check-v0716-readiness.py
          luac -p tests/lua_v0716_coords_stability.lua
          bash -n scripts/stage-v0716-testlab-dev.sh
          bash -n scripts/prepare-v0716-release.sh
          bash -n scripts/publish-v0716-sileo.sh
          grep -Fq 'release/v0716-build-ready.txt' .github/workflows/build-v0716-reliability-testlab.yml
          grep -Fq 'scripts/prepare-v0716-release.sh upstream' .github/workflows/build-v0716-reliability-testlab.yml
          grep -Fq 'scripts/publish-v0716-sileo.sh' .github/workflows/build-v0716-reliability-testlab.yml
          python3 -m py_compile scripts/apply-v0716-testlab-ui.py
          python3 -m py_compile tests/test_v0716_testlab_runner.py tests/test_v0716_testlab_ui.py
      - name: Test coordinate/Retina geometry and monotonic read-only polling
        run: |
          lua tests/lua_v0716_coords_stability.lua
      - name: Host-compile native Lua module and check touch preflight (no iOS build)
        run: |
          python3 -m unittest tests/test_v0716_native_preflight.py -v
      - name: Validate UTF-8 InputText/password dispatch and JSON strictness
        run: |
          lua tests/lua_v0716_input_json_hardening.lua
      - name: Validate HTTP atomic downloads and Vision frame lifetime
        run: |
          set -euxo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/network"
          NKTOUCH_HTTP_TMP="$work/network" lua tests/lua_v0716_http_atomic.lua "$work"
          lua tests/lua_v0716_vision_lifecycle.lua "$work"
      - name: Run native process supervisor success/stop/timeout isolation tests
        run: |
          python3 -m unittest tests/test_v0716_task_supervisor_host.py -v
      - name: Validate Vision RAM cleanup and Lua GC memory diagnostics
        run: |
          python3 -m unittest tests/test_v0716_memory_core.py -v
      - name: Verify two consecutive Test Lab runs and flag regressions
        run: |
          lua tests/lua_v0716_regression.lua "$RUNNER_TEMP/nktestlab-last.json"
      - name: Test seven groups and no-unsafe-action defaults
        run: |
          python3 -m unittest tests/test_v0716_testlab_runner.py -v
      - name: Test Test Lab UIKit staging and results viewer
        run: |
          python3 -m unittest tests/test_v0716_testlab_ui.py -v
      - name: Validate Reliability Report metrics and opt-in confirmation
        run: |
          python3 -m unittest tests/test_v0716_reliability_report.py -v
      - name: Reject false RGB matches and inconsistent screen/frame sizes
        run: |
          python3 -m unittest tests/test_v0716_color_accuracy.py -v
      - name: Run full dev API/CLI/Input and historical regression suite
        run: |
          lua tests/lua_v0716_json_network_input.lua
          python3 -m unittest tests/test_v0716_cli_parser.py tests/test_v0716_staged_api.py tests/test_v0715_lua_selftest.py tests/test_v0714_notes_screenfix.py -v
      - name: Review release gate (must remain blocked for unverified device groups)
        run: |
          python3 scripts/check-v0716-readiness.py
      - name: Recheck earlier Lua argument contracts
        run: |
          lua tests/lua_v0716_command_contract.lua
          python3 -m unittest tests/test_v0716_all_commands_audit.py -v
