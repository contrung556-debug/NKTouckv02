name: Validate NKTouch v0.8.3 External App Test (no iOS build)
on:
  push:
    branches: [v0.8.3-external-test-dev]
    paths:
      - lua/nktestlab.lua
      - patches/NKExternalAppLabMethods.m.inc
      - scripts/apply-v0803-external-test.py
      - scripts/prepare-v0803-release.sh
      - tests/test_v0803_external_test.py
      - .github/workflows/build-v0803-external-test.yml
      - .github/workflows/validate-v0803-external-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: External App Test and previous core regressions
        run: |
          set -euo pipefail
          bash -n scripts/prepare-v0803-release.sh
          python3 -m py_compile scripts/apply-v0803-external-test.py
          luac5.4 -p lua/nktestlab.lua
          python3 -m unittest \
            tests/test_v0803_external_test.py \
            tests/test_v0802_ocr_ipc.py \
            tests/test_v0801_ocr_buffer.py \
            tests/test_v0800_integrated.py \
            tests/test_v0800_release.py \
            tests/test_v0719_testlab_5core.py \
            tests/test_v0716_testlab_runner.py \
            tests/test_v0717_stability_memory.py -v
